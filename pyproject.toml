[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-playground-local"
version = "1.0.0"
description = "A safe local-first SQLite playground for queries, schema inspection, scripts, and CSV export."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
keywords = ["sqlite", "sql", "cli", "database", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
sql-playground = "sql_playground.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
